name: Publish Extension

# semantic-release picks the next version from Conventional Commits since the last v* tag, then
# publishes the VSIX to both registries, pushes the version commit and tag, and creates the GitHub
# release. Runs that find no release-worthy commits publish nothing.
on:
  workflow_dispatch:
    inputs:
      dry_run:
        description: Show the next version and release notes without publishing
        required: true
        type: boolean
        default: true
      pre_release:
        description: Publish a pre-release on the next odd minor version (1.1.x, 1.3.x)
        required: true
        type: boolean
        default: false

jobs:
  ci:
    uses: ./.github/workflows/ci.yml
    secrets: inherit
    permissions:
      contents: read
      issues: write
      pull-requests: write
      checks: write

  release:
    runs-on: ubuntu-24.04
    needs: ci
    permissions:
      # Push the version commit and tag, and create the GitHub release.
      contents: write
      # Comment on and label the issues and pull requests a release resolves.
      issues: write
      pull-requests: write
      # Exchange the job's OIDC token for an Open VSX publishing token (trusted publishing).
      id-token: write
    steps:
      - name: Checkout code
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5, Node 24
        with:
          # semantic-release reads every commit and tag since the last release.
          fetch-depth: 0

      - name: Setup Node.js
        uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6, Node 24
        with:
          node-version: "24"

      - name: Install dependencies
        run: npm ci

      # The release configuration loads scripts/release-version.ts from out/.
      - name: Compile the release plugin
        run: npx tsc -b

      # semantic-release-vsce reads Open VSX credentials only from OVSX_PAT, so this exports a
      # short-lived token issued for the repository and workflow registered as a trusted publisher.
      - name: Get an Open VSX publishing token
        run: npm run ops -- openvsx-token

      # The release tools are installed here rather than in package.json: semantic-release always
      # bundles an npm CLI whose dependencies can carry advisories, and it is never run because the
      # npm plugin is not configured.
      - name: Release
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          # Must be a PAT for all accessible organizations with Marketplace (Manage) scope. Azure
          # DevOps retires those on December 1, 2026.
          VSCE_PAT: ${{ secrets.VS_MARKETPLACE_TOKEN }}
          VSCE_PRE_RELEASE: ${{ inputs.pre_release }}
          DRY_RUN_FLAG: ${{ inputs.dry_run && '--dry-run' || '' }}
        run: |
          npx --yes \
            --package semantic-release@25.0.9 \
            --package semantic-release-vsce@6.1.8 \
            --package @semantic-release/git@11.0.1 \
            --package conventional-changelog-conventionalcommits@9.3.1 \
            semantic-release $DRY_RUN_FLAG

      # semantic-release only marks releases from prerelease branches, which would add a -suffix
      # that the registries reject, so the GitHub release is marked here instead.
      - name: Mark the GitHub release as a pre-release
        if: inputs.pre_release && !inputs.dry_run
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          tag=$(git tag --points-at HEAD --list 'v*')
          if [ -n "$tag" ]; then
            gh release edit "$tag" --prerelease
          fi
