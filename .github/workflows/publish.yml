name: Publish Extension

# semantic-release picks the extension's next version from Conventional Commits since the last v*
# tag, then tags it and creates the GitHub release with the VSIX; the publish job then publishes
# that VSIX to both registries with scripts/ops.ts. Releases never commit; the version is written
# into package.json in the CI workspace only. Runs that find no release-worthy commits publish
# nothing. See release.config.cjs and CONTRIBUTING.md#publishing.
#
# No secrets: each job's OIDC token is exchanged for its credentials. The jobs are split so that
# semantic-release and its plugins never run where a registry would accept the OIDC token:
# - release: no environment. Pushes the tag with an Octo STS token
#   (.github/chainguard/release.sts.yaml).
# - publish: the 'release' environment, which the Marketplace and Open VSX trusted publishers name.
on:
  workflow_dispatch:
    inputs:
      dry-run:
        description: Show the next version and release notes without publishing
        required: true
        type: boolean
        default: true
      pre-release:
        description: Publish a pre-release on the next odd minor version (1.1.x, 1.3.x)
        required: true
        type: boolean
        default: false

permissions: {}

jobs:
  release:
    # release.config.cjs only releases from main.
    if: ${{ github.ref == 'refs/heads/main' }}
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    concurrency:
      group: release-extension
      cancel-in-progress: false
    permissions:
      actions: read # For checking CI results
      contents: write # For the GitHub release
      id-token: write # For OIDC: the Octo STS tag token
      issues: write # For semantic-release comments
      pull-requests: write # For semantic-release comments
    outputs:
      tag: ${{ steps.tag.outputs.tag }}
    steps:
      - name: Checkout code
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5, Node 24
        with:
          fetch-depth: 0 # semantic-release reads every commit and tag since the last release
          persist-credentials: false

      # CI runs on every push to main, so this checks the result rather than running CI again.
      - name: Require CI success
        uses: ./.github/actions/require-ci-success
        with:
          sha: ${{ github.sha }}
          token: ${{ github.token }}

      # This job can mint a GitHub token, so dependencies' install scripts don't run.
      - name: Setup
        uses: ./.github/actions/setup
        with:
          ignore-scripts: true

      # Builds out/scripts/release-version.js, which release.config.cjs loads.
      - name: Compile
        run: npm run compile

      # semantic-release-vsce packages the VSIX for the GitHub release (publish: false), as a
      # pre-release when VSCE_PRE_RELEASE is set.
      - name: Release
        uses: ./.github/actions/semantic-release
        env:
          VSCE_PRE_RELEASE: ${{ inputs.pre-release }}
        with:
          working-directory: .
          dry-run: ${{ inputs.dry-run }}

      # The newest v* tag on HEAD is this run's release, or, when a run is retried after a partial
      # failure, the release it made.
      - name: Find the release tag
        id: tag
        if: ${{ !inputs.dry-run }}
        run:
          echo "tag=$(git tag --points-at HEAD --list 'v*' --sort=-v:refname | head -n 1)" >>
          "$GITHUB_OUTPUT"

      # semantic-release only marks releases from prerelease branches, which would add a -suffix
      # that the registries reject, so the GitHub release is marked here instead.
      - name: Mark the GitHub release as a pre-release
        if: ${{ inputs.pre-release && steps.tag.outputs.tag != '' }}
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ steps.tag.outputs.tag }}
        run: gh release edit "$TAG" --prerelease

  # Publishes the GitHub release's VSIX, so the registries get the file the release carries. ops.ts
  # skips registries that already have the version, so after a partial failure, Re-run failed jobs
  # publishes to the rest.
  publish:
    needs: release
    if: ${{ needs.release.outputs.tag != '' }}
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    environment: release
    concurrency:
      group: publish-extension
      cancel-in-progress: false
    permissions:
      contents: read # For downloading the release's VSIX
      id-token: write # For OIDC: Marketplace and Open VSX trusted publishing
    steps:
      - name: Checkout code
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5, Node 24
        with:
          persist-credentials: false

      # This job can mint registry tokens, so dependencies' install scripts don't run.
      - name: Setup
        uses: ./.github/actions/setup
        with:
          ignore-scripts: true

      - name: Publish the release's VSIX
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ needs.release.outputs.tag }}
          PRE_RELEASE_FLAG: ${{ inputs.pre-release && '--pre-release' || '' }}
        run: |
          set -euo pipefail
          version="${TAG#v}"
          vsix="$RUNNER_TEMP/keep-sorted-$version.vsix"
          gh release download "$TAG" --pattern "keep-sorted-$version.vsix" --output "$vsix"
          # ops.ts reads the version from package.json to find the registries that lack it.
          npm pkg set version="$version"
          npm run ops -- publish $PRE_RELEASE_FLAG --vsix "$vsix"
