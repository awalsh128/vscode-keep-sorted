name: Publish Extension

on:
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      dry_run:
        description: Perform a dry run without actual publishing
        required: true
        type: boolean
        default: true

jobs:
  ci:
    uses: ./.github/workflows/ci.yml
    secrets: inherit
    permissions:
      contents: read
      issues: write
      pull-requests: write
      checks: write

  publish:
    runs-on: ubuntu-24.04
    needs: ci
    permissions:
      contents: read
      # Registries whose token secret is unset get a short-lived publish credential in exchange for
      # this job's OIDC token (trusted publishing).
      id-token: write
    steps:
      - name: Checkout code
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5, Node 24

      - name: Setup Node.js
        uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6, Node 24
        with:
          node-version: "24"

      - name: Install dependencies
        run: npm ci

      # Packages one VSIX and publishes it to every registry that does not have this version yet,
      # so rerunning after a partial failure is safe. Releases are never dry runs.
      - name: Publish to Open VSX and Visual Studio Marketplace
        env:
          # Delete OPEN_VSX_TOKEN once this repository and publish.yml are registered at
          # https://open-vsx.org/user-settings/trusted-publishers.
          OVSX_PAT: ${{ secrets.OPEN_VSX_TOKEN }}
          # Must be a PAT for all accessible organizations with Marketplace (Manage) scope. Azure
          # DevOps retires those on December 1, 2026; delete the secret once trusted publishing works.
          VSCE_PAT: ${{ secrets.VS_MARKETPLACE_TOKEN }}
        run:
          npm run ops -- publish ${{ github.event.inputs.dry_run == 'true' && '--dry-run' || '' }}

      - name: Setup Environment
        run:
          node -e "console.log('PACKAGE_VERSION=' + require('./package.json').version +
          '\nPACKAGE_NAME=' + require('./package.json').name + '-' +
          require('./package.json').version)" >> $GITHUB_ENV

      - name: Publish artifact
        uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6, Node 24
        with:
          name: ${{ env.PACKAGE_NAME }}.vsix
          path: ./${{ env.PACKAGE_NAME }}.vsix
