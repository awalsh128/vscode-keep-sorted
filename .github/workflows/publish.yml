name: Publish Extension

on:
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      dry_run:
        description: Perform a dry run without actual publishing
        required: true
        type: boolean
        default: true

jobs:
  ci:
    uses: ./.github/workflows/ci.yml
    secrets: inherit
    permissions:
      contents: read
      issues: write
      pull-requests: write
      checks: write

  publish:
    runs-on: ubuntu-24.04
    needs: ci
    steps:
      - name: Checkout code
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5, Node 24

      - name: Publish to Open VSX Registry
        id: openvsx-publish
        uses: HaaLeo/publish-vscode-extension@1b8df468b849f76a143b8c18bf0ffa2075398d12 # v2, Node 24
        with:
          pat: ${{ secrets.OPEN_VSX_TOKEN }}
          dryRun: ${{ github.event.inputs.dry_run }}

      - name: Publish to Visual Studio Marketplace
        id: vsmarketplace-publish
        uses: HaaLeo/publish-vscode-extension@1b8df468b849f76a143b8c18bf0ffa2075398d12 # v2, Node 24
        with:
          pat: ${{ secrets.VS_MARKETPLACE_TOKEN }}
          registryUrl: https://marketplace.visualstudio.com
          extensionFile: ${{ steps.openvsx-publish.outputs.vsixPath }}
          dryRun: ${{ github.event.inputs.dry_run }}

      - name: Setup Environment
        run:
          node -e "console.log('PACKAGE_VERSION=' + require('./package.json').version +
          '\nPACKAGE_NAME=' + require('./package.json').name + '-' +
          require('./package.json').version)" >> $GITHUB_ENV

      - name: Publish artifact
        uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6, Node 24
        with:
          name: ${{ env.PACKAGE_NAME }}.vsix
          path: ./${{ env.PACKAGE_NAME }}.vsix
