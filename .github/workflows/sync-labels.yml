name: Sync Labels

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - ".github/labels.yaml"

jobs:
  sync:
    runs-on: ubuntu-24.04
    permissions:
      contents: read
      issues: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v5, Node 24

      - name: Setup Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v6, Node 24
        with:
          node-version: "24"
          cache: "npm"

      - name: Install dependencies
        run: npm ci

      - name: Sync labels
        run: npx tsx scripts/sync-labels.ts
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
