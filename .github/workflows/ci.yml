name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  schedule:
    - cron: "0 18 * * *"
  workflow_dispatch:
  workflow_call:

jobs:
  test:
    runs-on: ubuntu-24.04
    permissions:
      contents: read
      issues: write
      pull-requests: write
      checks: write

    steps:
      - name: Checkout code
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5, Node 24

      - name: Setup Node.js
        uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6, Node 24
        with:
          node-version: "24"
          cache: "npm"

      - name: Install dependencies
        shell: bash
        run: npm ci

      - uses: oke-py/npm-audit-action@f02a3cf15e7a1860efac849dd45126f9c2cafe4f
        with:
          audit_level: moderate
          github_token: ${{ secrets.GITHUB_TOKEN }}
          create_pr_comments: true
          create_issues: true
          issue_labels: vulnerability,test
          dedupe_issues: true

      - name: Run linting
        run: npm run lint

      - name: Run TypeScript compilation
        run: npm run compile

      - name: Run script tests (no Go required)
        run:
          npx mocha --require tsx --grep "regex" --timeout 10000
          scripts/test/create-binaries.test.ts

      - name: Run tests
        run: xvfb-run --auto-servernum npm test
