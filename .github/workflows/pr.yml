name: Pull Request Tests

on:
  pull_request:
    types: [opened, synchronize, reopened, edited]

permissions:
  contents: read

jobs:
  check-branch:
    name: Check branch
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      # main is only updated by promote.yml, which fast-forwards it to staging; a merge into main
      # would add a commit that staging doesn't have.
      - name: Require staging as the base branch
        env:
          BASE_REF: ${{ github.base_ref }}
        run: |
          if [ "$BASE_REF" != "staging" ]; then
            echo "::error::Pull requests target staging, not $BASE_REF; main is updated by promotion."
            exit 1
          fi

  commitlint:
    name: Lint pull request title
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v5, Node 24
        with:
          persist-credentials: false

      # commitlint needs no install scripts, and skipping them keeps title edits quick.
      - name: Setup
        uses: ./.github/actions/setup
        with:
          ignore-scripts: true

      # Pull requests are squash-merged with the title as the commit subject, and semantic-release
      # versions the release from it, so only the title has to be a Conventional Commit.
      - name: Lint pull request title
        env:
          TITLE: ${{ github.event.pull_request.title }}
        run: printf '%s\n' "$TITLE" | npx commitlint --verbose

  dependency-review:
    name: Dependency review
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v5, Node 24

      # Advisories in packages bundled inside the npm CLI that semantic-release depends on, in
      # .github/actions/semantic-release. Overrides can't replace bundled dependencies, and that code
      # never loads: release.config.cjs doesn't configure @semantic-release/npm. Remove each once npm
      # bundles a fixed version.
      # - GHSA-3g3m-2fjr-6pw4: glob < 14.0.2
      # - GHSA-g3hv-75wg-m249: minimatch < 11.0.1
      - name: Dependency Review
        uses: actions/dependency-review-action@bbc44d14a204704ccc493733616cd1e93a0321ec # v4
        with:
          allow-ghsas: GHSA-3g3m-2fjr-6pw4, GHSA-g3hv-75wg-m249

  check-binaries-not-in-pr:
    name: Check binaries are not included in PR
    # The Build Static Binaries workflow opens the one pull request allowed to change bin/. It is
    # skipped there (a skipped required check passes); every other pull request is checked.
    if:
      ${{ !(startsWith(github.head_ref, 'chore/update-binaries-') &&
      endsWith(github.event.pull_request.user.login, '[bot]')) }}
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v5, Node 24
        with:
          fetch-depth: 0

      - name: Check for binary changes
        run: |
          if git diff --name-only origin/${{ github.base_ref }}...HEAD | grep -q '^bin/'; then
            echo "❌ Error: Binaries should not be included in pull requests"
            echo "Binaries are built by the Build Static Binaries workflow, which opens its own PR"
            echo ""
            echo "Changed binary files:"
            git diff --name-only origin/${{ github.base_ref }}...HEAD | grep '^bin/'
            exit 1
          else
            echo "✅ No binary files in PR"
          fi
