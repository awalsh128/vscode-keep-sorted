name: Pull Request Tests

on:
  pull_request:
    branches:
      - main

permissions:
  contents: read

jobs:
  dependency-review:
    name: Dependency review
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout code
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5, Node 24

      # GHSA-3g3m-2fjr-6pw4: glob 13 bundled inside the npm CLI that semantic-release depends on, in
      # .github/actions/semantic-release. Overrides can't replace bundled dependencies, and that code
      # never loads: release.config.cjs doesn't configure @semantic-release/npm. Remove once npm
      # bundles glob >= 14.0.2.
      - name: Dependency Review
        uses: actions/dependency-review-action@v4
        with:
          allow-ghsas: GHSA-3g3m-2fjr-6pw4

  check-binaries-not-in-pr:
    name: Check binaries are not included in PR
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout code
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5, Node 24
        with:
          fetch-depth: 0

      - name: Check for binary changes
        run: |
          if git diff --name-only origin/${{ github.base_ref }}...HEAD | grep -q '^bin/'; then
            echo "❌ Error: Binaries should not be included in pull requests"
            echo "Binaries are built and committed by the Build Static Binaries workflow"
            echo ""
            echo "Changed binary files:"
            git diff --name-only origin/${{ github.base_ref }}...HEAD | grep '^bin/'
            exit 1
          else
            echo "✅ No binary files in PR"
          fi
