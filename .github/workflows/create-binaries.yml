name: Build Static Binaries

# Building and committing binaries must be intentional, so this workflow only runs when started
# manually. Regular CI covers the script's Go-free unit tests.
on:
  workflow_dispatch:

jobs:
  test-create-binaries:
    name: Test create-binaries script
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5, Node 24

      - name: Setup Go
        uses: actions/setup-go@44694675825211faa026b3c33043df3e48a5fa00
        with:
          # keep-sorted needs Go >= 1.23.1; Go >= 1.24 stamps the release tag into --version
          go-version: "1.26.x"
          cache: false

      - name: Setup Node.js
        uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6, Node 24
        with:
          node-version: "24"
          cache: "npm"

      - name: Install dependencies
        run: npm ci

      - name: Run create-binaries tests
        run: npx mocha --require tsx --timeout 300000 scripts/test/create-binaries.test.ts

  build-binaries:
    needs: test-create-binaries
    name: Build all platform binaries
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5, Node 24

      - name: Setup Go
        uses: actions/setup-go@44694675825211faa026b3c33043df3e48a5fa00
        with:
          # Keep in sync with the test job so CI builds match what was tested
          go-version: "1.26.x"
          cache: false

      - name: Setup Node.js
        uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6, Node 24
        with:
          node-version: "24"
          cache: "npm"

      - name: Install dependencies
        run: npm ci

      - name: Build all binaries
        run: npm run create-binaries

      - name: Verify binaries exist
        run: |
          ls -lh bin/
          file bin/keep-sorted*

      - name: Verify Linux binary is static
        run: |
          ldd bin/keep-sorted-linux-amd64 || echo "Binary is static (no dynamic dependencies)"

      # A tar archive preserves permissions assigned by create-binaries.ts across jobs.
      - name: Archive binaries with permissions
        run: tar -cf keep-sorted-binaries.tar bin/

      - name: Upload binaries as artifacts
        uses: actions/upload-artifact@834a144ee995460fba8ed112a2fc961b36a5ec5a
        with:
          name: keep-sorted-binaries
          path: keep-sorted-binaries.tar
          if-no-files-found: error
          retention-days: 30

  commit-binaries:
    name: Commit binaries to repository
    needs: build-binaries
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5, Node 24

      - name: Download binaries
        uses: actions/download-artifact@fa0a91b85d4f404e444e00e005971372dc801d16
        with:
          name: keep-sorted-binaries
          path: .

      - name: Extract binaries with original permissions
        run: tar -xpf keep-sorted-binaries.tar

      - name: Commit binaries
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add bin/
          git diff --staged --quiet || git commit -m "chore: update static binaries [skip ci]"
          git push || echo "No changes to push"
