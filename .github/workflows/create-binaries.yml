name: Build Static Binaries

# Building and committing binaries must be intentional, so this workflow only runs when started
# manually, on staging. It opens a pull request into staging, because staging only takes pull
# requests. Regular CI covers the script's Go-free unit tests.
on:
  workflow_dispatch:

# The test and build jobs only read the code. commit-binaries sets its own permissions.
permissions:
  contents: read

jobs:
  test-create-binaries:
    name: Test create-binaries script
    runs-on: ubuntu-24.04

    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v5, Node 24

      - name: Setup Go
        uses: actions/setup-go@d8cbb8045d7f43706b9177cceb36c1f91a6644d5
        with:
          # keep-sorted needs Go >= 1.23.1; Go >= 1.24 stamps the release tag into --version
          go-version: "1.26.x"
          cache: false

      - name: Setup Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v6, Node 24
        with:
          node-version: "24"
          cache: "npm"

      - name: Install dependencies
        run: npm ci

      - name: Run create-binaries tests
        run: npx mocha --require tsx --timeout 300000 scripts/test/create-binaries.test.ts

  build-binaries:
    needs: test-create-binaries
    name: Build all platform binaries
    runs-on: ubuntu-24.04

    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v5, Node 24

      - name: Setup Go
        uses: actions/setup-go@d8cbb8045d7f43706b9177cceb36c1f91a6644d5
        with:
          # Keep in sync with the test job so CI builds match what was tested
          go-version: "1.26.x"
          cache: false

      - name: Setup Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v6, Node 24
        with:
          node-version: "24"
          cache: "npm"

      - name: Install dependencies
        run: npm ci

      - name: Build all binaries
        run: npm run create-binaries

      - name: Verify binaries exist
        run: |
          ls -lh bin/
          file bin/keep-sorted*

      - name: Verify Linux binary is static
        run: |
          ldd bin/keep-sorted-linux-amd64 || echo "Binary is static (no dynamic dependencies)"

      # A tar archive preserves permissions assigned by create-binaries.ts across jobs.
      - name: Archive binaries with permissions
        run: tar -cf keep-sorted-binaries.tar bin/

      - name: Upload binaries as artifacts
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        with:
          name: keep-sorted-binaries
          path: keep-sorted-binaries.tar
          if-no-files-found: error
          retention-days: 30

  commit-binaries:
    name: Open a pull request with the binaries
    needs: build-binaries
    # The trust policy (.github/chainguard/binaries.sts.yaml) only matches this workflow on staging.
    if: ${{ github.ref == 'refs/heads/staging' }}
    runs-on: ubuntu-24.04
    permissions:
      contents: read
      id-token: write # For OIDC: the Octo STS token that pushes the branch and opens the PR

    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v5, Node 24
        with:
          persist-credentials: false

      - name: Download binaries
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333
        with:
          name: keep-sorted-binaries
          path: .

      - name: Extract binaries with original permissions
        run: tar -xpf keep-sorted-binaries.tar

      # A token from an app, not GITHUB_TOKEN, so the pull request's required checks run.
      - name: Create pull request token
        id: octo-sts
        uses: octo-sts/action@f603d3be9d8dd9871a265776e625a27b00effe05 # v1.1.1
        with:
          scope: ${{ github.repository }}
          identity: binaries

      - name: Open a pull request
        env:
          TOKEN: ${{ steps.octo-sts.outputs.token }}
          GH_TOKEN: ${{ steps.octo-sts.outputs.token }}
          BRANCH: chore/update-binaries-${{ github.run_id }}
        run: |
          set -euo pipefail
          UPSTREAM_VERSION="$(jq -r .version bin/keep-sorted.version.json)"
          UPSTREAM_COMMIT="$(jq -r .commit bin/keep-sorted.version.json)"
          git add bin/
          if git diff --staged --quiet; then
            echo "The binaries are already up to date."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git commit -m "chore: update static binaries to keep-sorted ${UPSTREAM_VERSION}"
          git push "https://x-access-token:${TOKEN}@github.com/${GITHUB_REPOSITORY}.git" \
            "HEAD:refs/heads/${BRANCH}"
          gh pr create --base staging --head "$BRANCH" \
            --title "chore: update static binaries to keep-sorted ${UPSTREAM_VERSION}" \
            --body "Binaries built by the [Build Static Binaries](${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID}) workflow from google/keep-sorted ${UPSTREAM_VERSION} (commit ${UPSTREAM_COMMIT}). \`bin/keep-sorted.version.json\` records it."
