# Configuration for automatically generated release notes
# https://docs.github.com/en/repositories/releasing-projects-on-github/automatically-generated-release-notes
# Labels must exist in .github/labels.yaml.

changelog:
  exclude:
    labels:
      - invalid
      - duplicate
      - wontfix
      - question
    authors:
      - dependabot
      - dependabot[bot]

  categories:
    - title: "Breaking Changes"
      labels:
        - breaking-change

    - title: "New Features"
      labels:
        - enhancement

    - title: "Bug Fixes"
      labels:
        - bug

    - title: "Performance"
      labels:
        - performance

    - title: "Security"
      labels:
        - vulnerability

    - title: "Documentation"
      labels:
        - documentation

    - title: "Dependencies"
      labels:
        - dependencies

    - title: "CI/CD"
      labels:
        - github_actions

    - title: "Other Changes"
      labels:
        - "*"
