# yaml-language-server: $schema=https://raw.githubusercontent.com/octo-sts/app/refs/heads/main/pkg/octosts/octosts.TrustPolicy.json

# Tokens for the semantic-release action to push release tags. Octo STS reads this file from the
# default branch (main), and only the publish workflow running on main matches. The subject carries
# the owner and repository IDs, so a repository that later takes this name doesn't match either.
# See CONTRIBUTING.md#release-credentials.
issuer: https://token.actions.githubusercontent.com
subject_pattern: "repo:awalsh128@2087466/vscode-keep-sorted@1078628435:.*"
claim_pattern:
  ref: "refs/heads/main"
  job_workflow_ref: "awalsh128/vscode-keep-sorted/\\.github/workflows/publish\\.yml@refs/heads/main"

permissions:
  contents: write
