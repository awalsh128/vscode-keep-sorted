name: "Setup environment"
description: "Sets up Node.js and installs dependencies"

inputs:
  ignore-scripts:
    description: >-
      Skip install scripts, both dependencies' and the root prepare script (husky). For privileged
      jobs, so dependency code can't run with their credentials at install.
    required: false
    default: "false"

runs:
  using: "composite"
  steps:
    - name: Setup Node.js
      uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6, Node 24
      with:
        node-version: "24"
        cache: "npm"
        registry-url: "https://registry.npmjs.org"

    - name: Install dependencies
      shell: bash
      env:
        IGNORE_SCRIPTS: ${{ inputs.ignore-scripts }}
      run: |
        set -euo pipefail
        if [[ "$IGNORE_SCRIPTS" == "true" ]]; then
          npm ci --ignore-scripts
        else
          npm ci
        fi
